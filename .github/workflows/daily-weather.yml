name: Scheduled WeChat Messages

on:
  schedule:
    # GitHub Actions 使用 UTC；22:10 UTC = 北京时间次日 06:10。
    - cron: "10 22 * * *"
    # 15:20 UTC = 北京时间 10 月 30 日 23:20。
    - cron: "20 15 30 10 *"
  workflow_dispatch:
    inputs:
      message_kind:
        description: "手动测试的消息类型"
        required: false
        default: auto
        type: choice
        options:
          - auto
          - weather
          - birthday

jobs:
  send-message:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install requests

      - name: Build and send message
        run: python weather.py
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          PUSHPLUS_TOPIC: hangzhou_weather
          MESSAGE_KIND: ${{ inputs.message_kind || 'auto' }}
