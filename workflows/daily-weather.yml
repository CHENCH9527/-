name: Scheduled WeChat Messages

on:
  schedule:
    # GitHub Actions 使用 UTC；23:00 UTC = 北京时间次日 07:00。
    - cron: "0 23 * * *"
    # 16:00 UTC = 北京时间次日 00:00，用于 10 月 31 日生日特别来信。
    - cron: "0 16 * * *"
  workflow_dispatch:
    inputs:
      message_kind:
        description: "手动测试的消息类型"
        required: false
        default: auto
        type: choice
        options:
          - auto
          - weather
          - birthday

jobs:
  send-message:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install requests

      - name: Build and send message
        run: python weather.py
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          PUSHPLUS_TOPIC: hangzhou_weather
          MESSAGE_KIND: ${{ inputs.message_kind || 'auto' }}
